<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#40c0c8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fun Fluency 1C">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>1C Semana 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one phone-width app column; a sticky bar on top, one view at a time below it */
:root{
  --bg:#FFF8E7; --card:#ffffff; --ink:#10343a; --ink-2:#47636a; --line:#eadfc4;
  --teal:#40c0c8; --teal-ink:#10343a; --teal-soft:#e3f6f7; --teal-deep:#1c7a81;
  --pink:#ec406d; --pink-soft:#fde3ea; --pink-ink:#a3173f;
  --yellow:#f8cf19; --yellow-soft:#fff3c2; --maroon:#560000;
  --good:#1f8a4c; --good-soft:#dcf3e5; --bad:#b4233f; --bad-soft:#fbe0e5;
  --hl:#fff0a6; --dark:#10343a; --on-dark:#ffffff;
  --display:'Baloo 2', 'Nunito', system-ui, sans-serif;
  --body:'Nunito', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f2226; --card:#16313a; --ink:#eef7f6; --ink-2:#a9c4c7; --line:#27464e;
  --teal:#3ab4bc; --teal-ink:#06262a; --teal-soft:#123c42; --teal-deep:#7fd8de;
  --pink:#f05a80; --pink-soft:#3e1c28; --pink-ink:#ff9fb6;
  --yellow:#f8cf19; --yellow-soft:#3a3214; --maroon:#ffe9a8;
  --good:#5fd38d; --good-soft:#163a27; --bad:#ff8ea3; --bad-soft:#40202a;
  --hl:#5a4b0f; --dark:#eef7f6; --on-dark:#0f2226; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f2226; --card:#16313a; --ink:#eef7f6; --ink-2:#a9c4c7; --line:#27464e;
  --teal:#3ab4bc; --teal-ink:#06262a; --teal-soft:#123c42; --teal-deep:#7fd8de;
  --pink:#f05a80; --pink-soft:#3e1c28; --pink-ink:#ff9fb6;
  --yellow:#f8cf19; --yellow-soft:#3a3214; --maroon:#ffe9a8;
  --good:#5fd38d; --good-soft:#163a27; --bad:#ff8ea3; --bad-soft:#40202a;
  --hl:#5a4b0f; --dark:#eef7f6; --on-dark:#0f2226; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:480px;margin:0 auto;padding-block:0 40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
img{max-width:100%;display:block}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.back{width:44px;height:44px;border-radius:999px;border:0;background:var(--card);display:grid;place-items:center;flex-shrink:0}
.back[hidden]{display:none}
.bar-text{display:flex;flex-direction:column;min-width:0;flex:1}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-deep)}
.bar h1{font-size:26px;font-weight:800}
.brand{font-family:var(--display);font-weight:800;color:var(--pink-ink);font-size:15px}
.level{font-size:13px;font-weight:800;background:var(--yellow);color:#560000;padding:4px 12px;border-radius:999px;flex-shrink:0}

/* overview */
.hero{background:var(--teal);color:var(--teal-ink);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero img{border-radius:16px;background:#fff;width:100%;aspect-ratio:330/165;object-fit:cover;object-position:center 30%}
.hero h2{font-size:28px;font-weight:800}
.meter{height:10px;background:rgba(255,255,255,.55);border-radius:999px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--teal-ink);border-radius:999px;transition:width .4s}
.meter-label{font-size:14px;font-weight:700}
.steps{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.step{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid transparent;border-radius:20px;padding:12px 14px;min-height:72px;text-align:left;width:100%}
.step.next{border-color:var(--pink)}
.step .dot{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;flex-shrink:0;font-weight:800;border:2px solid var(--line);color:var(--ink-2)}
.step.done .dot{background:var(--teal-deep);border-color:var(--teal-deep);color:var(--bg)}
.step.next .dot{background:var(--pink);border-color:var(--pink);color:#fff}
.step-t{font-weight:800;font-size:17px}
.step-s{font-size:13px;color:var(--ink-2)}
.step.next .step-s{color:var(--pink-ink);font-weight:700}
.step .grow{flex:1;min-width:0}
.note{font-size:13px;color:var(--ink-2);margin-top:18px;padding:12px 14px;border:1px dashed var(--line);border-radius:14px}
.reset{background:none;border:0;color:var(--ink-2);text-decoration:underline;font-size:13px;padding:8px 0;margin-top:6px}

/* shared */
.lead{font-size:15px;color:var(--ink-2);margin:0 0 14px}
.tip{background:var(--yellow);color:#560000;border-radius:18px;padding:12px 16px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:999px;background:var(--dark);color:var(--on-dark);font-weight:800;font-size:17px;margin-top:18px}
.ghost{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.speak{width:44px;height:44px;border:0;border-radius:999px;background:var(--pink);display:grid;place-items:center;flex-shrink:0}
.speak.on{background:var(--teal-deep)}

/* words */
.words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.word{background:var(--card);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:8px}
.word .pic{background:#fff;border-radius:14px;height:112px;display:grid;place-items:center;overflow:hidden}
.word .pic img{max-height:104px;width:auto;object-fit:contain}
.word .pic.txt{background:var(--teal-soft);font-family:var(--display);font-weight:800;font-size:22px;color:var(--teal-deep)}
.word-row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.es{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.05}
.en{font-size:13px;color:var(--ink-2)}

/* story */
.story-pic{background:#fff;border-radius:22px;overflow:hidden}
.story-pic img{width:100%;aspect-ratio:330/165;object-fit:cover}
.pager{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--pink);width:24px}
.text{background:var(--card);border-radius:20px;padding:16px 18px;font-size:20px;line-height:1.55;font-weight:700}
.text .s{border-radius:6px;padding:0 2px;transition:background .2s}
.text .s.hl{background:var(--hl)}
.player{background:var(--dark);color:var(--on-dark);border-radius:24px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.pbtn{width:48px;height:48px;border:0;border-radius:999px;background:color-mix(in srgb, var(--on-dark) 16%, transparent);display:grid;place-items:center;color:var(--on-dark)}
.play{width:72px;height:72px;background:var(--pink);color:#fff}
.speed{width:auto;min-width:68px;padding:0 14px;font-weight:800;font-size:14px}
.speed.slow{background:var(--yellow);color:#560000}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;min-height:44px}
.chip.open{border-color:var(--teal-deep);background:var(--teal-soft)}
.chip small{display:block;font-weight:600;font-size:12px;color:var(--ink-2)}
.navrow{display:flex;gap:12px;margin-top:16px}
.navrow .cta{margin-top:0}

/* practice */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.tab{border:0;background:var(--card);border-radius:999px;padding:10px 16px;font-weight:800;white-space:nowrap;min-height:44px}
.tab.on{background:var(--teal);color:var(--teal-ink)}
.panel{background:var(--card);border-radius:22px;padding:16px}
.panel h3{font-size:22px;font-weight:800;margin-bottom:4px}
.q-pic{background:#fff;border-radius:16px;height:180px;display:grid;place-items:center;margin:12px 0}
.q-pic img{max-height:170px;width:auto}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 16px;text-align:left;font-weight:800;font-size:17px;min-height:52px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.count{font-size:13px;font-weight:800;color:var(--ink-2)}
.feedback{min-height:24px;font-weight:800;margin-top:10px}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.cf{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.cf-row{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.cf-q{font-weight:700;font-size:17px}
.cf-btns{display:flex;gap:8px}
.cf-btns button{flex:1;min-height:44px;border-radius:999px;border:2px solid var(--line);background:var(--bg);font-weight:800}
.cf-btns button.right{border-color:var(--good);background:var(--good-soft)}
.cf-btns button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.cmd{font-family:var(--display);font-weight:800;font-size:34px;text-align:center;padding:28px 10px;line-height:1.1;text-wrap:balance}
.cmd-en{text-align:center;color:var(--ink-2);margin-top:-18px;margin-bottom:12px}
.builder{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.col-label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pick button{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-weight:800;min-height:44px}
.pick button.on{border-color:var(--pink);background:var(--pink-soft)}
.sentence{background:var(--yellow-soft);color:var(--ink);border-radius:16px;padding:14px 16px;font-family:var(--display);font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:space-between;gap:10px}

/* grammar */
.gram{background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.gram h3{font-size:22px;font-weight:800}
.ex{background:var(--teal-soft);border-radius:14px;padding:10px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ex span small{display:block;font-weight:600;color:var(--ink-2);font-size:13px}
table.pair{width:100%;border-collapse:collapse;font-size:16px}
table.pair td{padding:8px 6px;border-bottom:1px solid var(--line)}
table.pair td:first-child{font-weight:800}

/* quiz */
.score{text-align:center;padding:20px 10px}
.score b{font-family:var(--display);font-size:64px;line-height:1;display:block;color:var(--pink-ink)}
.listen{display:flex;align-items:center;gap:12px;background:var(--teal-soft);border-radius:16px;padding:12px 14px;margin:12px 0;font-weight:800}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:var(--on-dark);padding:12px 18px;border-radius:999px;font-weight:800;z-index:20;max-width:90vw;text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>

/* ---------- audio: browser Spanish voice as sample audio ---------- */
const synth = window.speechSynthesis;
let voice=null;
function pickVoice(){
  if(!synth) return;
  const v = synth.getVoices();
  voice = v.find(x=>/es[-_](MX|US)/i.test(x.lang)) || v.find(x=>/^es/i.test(x.lang)) || null;
}
if(synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
let slow=false;
function say(text, onend){
  if(!synth){ toast('Este navegador no tiene audio de voz.'); onend && onend(); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = voice ? voice.lang : 'es-MX';
  if(voice) u.voice = voice;
  u.rate = slow ? 0.65 : 0.9;
  u.onend = ()=> onend && onend();
  u.onerror = ()=> onend && onend();
  synth.speak(u);
}
function stopAudio(){ if(synth) synth.cancel(); }

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let toastTimer;
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true, 2200); }

    txt.innerHTML = STORY[page].map((s,i)=>`<span class="s" data-i="${i}">${esc(s)}</span>`).join(' ');
    $('#pg').textContent = `Página ${page+1} de ${STORY.length}`;
    $('#dots').innerHTML = STORY.map((_,i)=>`<i class="${i===page?'on':''}"></i>`).join('');
    $('#prev').disabled = page===0; $('#prev').style.opacity = page===0?.4:1;
    $('#nxt').innerHTML = page===STORY.length-1 ? `${ICON.check} Terminé la historia` : `Siguiente ${ICON.next}`;
    txt.querySelectorAll('.s').forEach(el=>el.addEventListener('click',()=>{ stop(); sIdx=+el.dataset.i; start(); }));
  }
  function hl(i){ txt.querySelectorAll('.s').forEach(el=>el.classList.toggle('hl', +el.dataset.i===i)); }
  function stop(){ playing=false; stopAudio(); play.innerHTML=ICON.play; play.setAttribute('aria-label','Escuchar'); hl(-1); }
  function start(){
    playing=true; play.innerHTML=ICON.pause; play.setAttribute('aria-label','Pausar');
    const run=()=>{
      if(!playing) return;
      if(sIdx>=STORY[page].length){ stop(); sIdx=0; return; }
      hl(sIdx); say(STORY[page][sIdx], ()=>{ if(!playing) return; sIdx++; setTimeout(run, 350); });
    };
    run();
  }
  play.addEventListener('click',()=> playing ? stop() : start());
  $('#rep').addEventListener('click',()=>{ stop(); sIdx=0; start(); });
  spd.addEventListener('click',()=>{ slow=!slow; spd.classList.toggle('slow',slow); spd.textContent=slow?'Lento':'1x'; if(playing){ stop(); start(); } });
  $('#prev').addEventListener('click',()=>{ if(page>0){ stop(); page--; sIdx=0; draw(); } });
  $('#nxt').addEventListener('click',()=>{
    stop();
    if(page<STORY.length-1){ page++; sIdx=0; draw(); }
    else { mark('historia'); toast('¡Muy bien! Paso completado.'); go('practica'); }

function practica(){
  header('Semana 1 · Paso 3','¡Practica!',true);
  const T = [['emparejar','Empareja'],['cf','¿Cierto o falso?'],['actua','¡Actúalo!'],['escribe','Escribe']];
  let tab='emparejar';
  view.innerHTML = `
    <div class="tabs" role="tablist">${T.map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}">${l}</button>`).join('')}</div>
    <div id="panel"></div>
    ${finishBtn('practica','Terminé de practicar','gramatica')}`;
  const panel=$('#panel');
  function setTab(k){ tab=k; stopAudio(); view.querySelectorAll('.tab').forEach(b=>{ b.classList.toggle('on', b.dataset.tab===k); b.setAttribute('aria-selected', b.dataset.tab===k); }); ({emparejar, cf, actua, escribe})[k](); }
  view.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));

  function emparejar(){
    const items = shuffle(WORDS.filter(w=>w.k)); let i=0, score=0;
    function q(){
      if(i>=items.length){ panel.innerHTML=`<div class="score"><b>${score}/${items.length}</b>¡Muy bien! Terminaste el juego.</div><button class="cta ghost" id="again">Jugar otra vez</button>`; $('#again').onclick=emparejar; return; }
      const w=items[i];
      const opts = shuffle([w, ...shuffle(WORDS.filter(x=>x!==w)).slice(0,2)]);
      panel.innerHTML = `<h3>Empareja</h3><span class="count">Dibujo ${i+1} de ${items.length}</span>
        <div class="q-pic"><img src="${IMG[w.k]}" alt="Dibujo para emparejar"></div>
        <div class="opts">${opts.map(o=>`<button class="opt" lang="es" data-ok="${o===w}">${esc(o.es)}</button>`).join('')}</div>
        <div class="feedback" id="fb" aria-live="polite"></div>`;
      panel.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
        const ok=b.dataset.ok==='true';
        panel.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x.dataset.ok==='true') x.classList.add('right'); });
        if(!ok) b.classList.add('wrong'); else score++;
        const fb=$('#fb'); fb.className='feedback '+(ok?'ok':'no'); fb.textContent = ok?'¡Sí! '+w.es+' = '+w.en : 'Es "'+w.es+'" ('+w.en+')';
        say(w.es); setTimeout(()=>{ i++; q(); }, 1500);
      }));
    }
    q();
  }
  function cf(){
    let right=0, answered=0;
    panel.innerHTML = `<h3>¿Cierto o falso?</h3><p class="lead">Piensa en la historia "El chico nuevo".</p>
      <div class="cf">${CF.map(([s,v],i)=>`<div class="cf-row"><div class="cf-q" lang="es">${i+1}. ${esc(s)}</div>
        <div class="cf-btns"><button data-i="${i}" data-v="true">Cierto</button><button data-i="${i}" data-v="false">Falso</button></div></div>`).join('')}</div>
      <div class="feedback ok" id="cfscore" aria-live="polite"></div>`;
    panel.querySelectorAll('.cf-btns button').forEach(b=>b.addEventListener('click',()=>{
      const row=b.parentElement; if(row.dataset.done) return; row.dataset.done=1; answered++;
      const truth=CF[+b.dataset.i][1]; const ok=(b.dataset.v==='true')===truth;
      if(ok) right++; b.classList.add(ok?'right':'wrong');
      if(!ok) row.querySelector(`[data-v="${truth}"]`).classList.add('right');
      if(answered===CF.length) $('#cfscore').textContent = `${right} de ${CF.length} correctas`;
    }));
  }
  function actua(){
    let order=shuffle(CMDS), i=0;
    function draw(){
      const [es,en]=order[i%order.length];
      panel.innerHTML = `<h3>¡Actúalo!</h3><p class="lead">Escucha el comando y hazlo con tu cuerpo. Un adulto puede decir "¡Para!".</p>
        <div class="cmd" lang="es">${esc(es)}</div><div class="cmd-en">${esc(en)}</div>
        <div class="navrow"><button class="cta ghost" id="hear">${ICON.spk.replace('#fff','currentColor')} Escuchar</button><button class="cta" id="more">Otro ${ICON.next}</button></div>`;
      $('#hear').onclick=()=>say(es.replace(/^Di: /,''));
      $('#more').onclick=()=>{ i++; draw(); say(order[i%order.length][0].replace(/^Di: /,'')); };
    }
    draw();
  }
  function escribe(){
    const pick={a:null,b:null,c:null};
    function draw(){
      const s = [pick.a,pick.b,pick.c].filter(Boolean).join(' ');
      const full = pick.a&&pick.b&&pick.c;
      panel.innerHTML = `<h3>Escribe tu frase</h3><p class="lead">Elige una palabra de cada grupo. Ejemplo: La chica va a la escuela.</p>
        <div class="builder">
          ${['a','b','c'].map((g,gi)=>`<div><div class="col-label">${['¿Quién?','¿Qué hace?','¿Qué?'][gi]}</div>
            <div class="pick">${BUILD[g].map(w=>`<button data-g="${g}" data-w="${esc(w)}" class="${pick[g]===w?'on':''}" lang="es">${esc(w)}</button>`).join('')}</div></div>`).join('')}
          <div class="sentence" lang="es"><span>${full?esc(s)+'.':(s?esc(s)+' …':'Tu frase va aquí')}</span>
            ${full?`<button class="speak" id="say" aria-label="Escuchar mi frase">${ICON.spk}</button>`:''}</div>
          ${full?`<p class="lead" style="margin:0">¿Es normal o no normal? ¡Dilo en voz alta y escríbelo en tu cuaderno!</p>`:''}
        </div>`;
      panel.querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>{ pick[b.dataset.g]=b.dataset.w; draw(); }));
      if(full) $('#say').onclick=()=>say(s);
    }
    draw();
  }
  setTab('emparejar');
}

      ${it.listen?`<div class="listen"><button class="speak" id="lis" aria-label="Escuchar la frase">${ICON.spk}</button> Toca para escuchar</div>`:''}
      ${it.img?`<div class="q-pic"><img src="${IMG[it.img]}" alt="Dibujo de la pregunta"></div>`:''}
      <div class="opts" style="margin-top:12px">${it.o.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join('')}</div>
      <div class="feedback" id="fb" aria-live="polite"></div></div>`;
    if(it.listen){ $('#lis').onclick=()=>say(it.listen); }
    view.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      const ok=+b.dataset.j===it.a; if(ok) score++;
      view.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(+x.dataset.j===it.a) x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      const fb=$('#fb'); fb.className='feedback '+(ok?'ok':'no'); fb.textContent= ok?'¡Correcto!':'La respuesta es: '+it.o[it.a];
      setTimeout(()=>{ i++; q(); }, 1400);
    }));
  }
  q();
}

home();
</script>

</body>
</html>
